  <!-- Theme Detection Script -->
  <script>
    // Detect system preference and saved theme
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
    
    // Set theme immediately to prevent flash
    document.documentElement.setAttribute('data-theme', initialTheme);
    
    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      }
    });
  </script>
  
  <style>
    /* Theme Variables */
    :root {
      /* Light Theme - warm cardstock */
      --bg-primary: #eee8db;
      --bg-secondary: #fbf8f1;
      --bg-texture: url('data:image/svg+xml,<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%25" height="100%25" filter="url(%23n)" opacity="0.035"/></svg>');
      --text-primary: #1c1917;
      --text-secondary: rgba(28, 25, 23, 0.58);
      --border-color: #d8d0bf;
      --border-accent: #1c1917;
      --accent: #8a6a2f;
      --accent-strong: #6e5424;
      --shadow-light: rgba(255, 255, 255, 0.9);
      --shadow-dark: rgba(35, 28, 15, 0.1);
      --accent-gradient: linear-gradient(145deg, rgba(255,255,255,0.35) 0%, transparent 100%);
      --shimmer-start: rgba(255, 255, 255, 0.2);
      --shimmer-end: rgba(255, 255, 255, 0);
      --hover-bg: linear-gradient(90deg, rgba(28,25,23,0.045) 0%, rgba(28,25,23,0) 100%);

      /* Shared */
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    [data-theme="dark"] {
      /* Dark Theme - ink on slate */
      --bg-primary: #111110;
      --bg-secondary: #1b1a17;
      --bg-texture: url('data:image/svg+xml,<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%25" height="100%25" filter="url(%23n)" opacity="0.05"/></svg>');
      --text-primary: #ece7db;
      --text-secondary: rgba(236, 231, 219, 0.58);
      --border-color: #34322c;
      --border-accent: #55503f;
      --accent: #c9a24b;
      --accent-strong: #e0b862;
      --shadow-light: rgba(255, 255, 255, 0.04);
      --shadow-dark: rgba(0, 0, 0, 0.5);
      --accent-gradient: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, transparent 100%);
      --shimmer-start: rgba(255, 255, 255, 0.07);
      --shimmer-end: rgba(255, 255, 255, 0);
      --hover-bg: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
    }
    
    html {
      box-sizing: border-box;
      transition: var(--transition-smooth);
    }
    *, *::before, *::after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg-primary) var(--bg-texture);
      font-family: 'Fraunces', serif;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      transition: var(--transition-smooth);
      animation: fadeIn 1s ease-out;
    }
    
    /* Loading state for fonts */
    .fonts-loading {
      visibility: hidden;
    }
    
    .fonts-loaded {
      visibility: visible;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        background-position: -100px 0;
      }
      to {
        opacity: 1;
        background-position: 0 0;
      }
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      animation: slideInFromTop 0.8s ease-out 0.3s both;
    }
    
    @keyframes slideInFromTop {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .logo-symbol {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border-accent);
      border-radius: 2px;
      background: var(--bg-secondary);
      box-shadow: inset 0 0 0 1px var(--shadow-light), 0 1px 2px var(--shadow-dark);
      transition: var(--transition-smooth);
      cursor: default;
    }

    .logo-symbol:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      color: var(--accent);
    }
    .logo-line {
      height: 2rem;
      width: 1px;
      background: var(--border-accent);
      opacity: 0.3;
      transition: var(--transition-smooth);
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Fraunces', serif;
    }
    .logo-name {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .logo-tag {
      font-size: 0.82rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
      margin-top: 0.2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: var(--transition-smooth);
    }
    .card-container {
      max-width: 780px;
      width: 100%;
      perspective: 1500px;
      animation: slideInFromBottom 0.8s ease-out 0.1s both;
    }
    
    @keyframes slideInFromBottom {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #flip-toggle {
      display: none;
    }
    .card {
      width: 100%;
      aspect-ratio: 780 / 450;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateY(var(--flip, 0deg)) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(var(--lift, 0px));
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
      will-change: transform, box-shadow;
      box-shadow: 0 1px 2px var(--shadow-dark), 0 8px 24px -8px var(--shadow-dark);
    }
    .card:hover {
      --lift: -2px;
      box-shadow: 0 2px 4px var(--shadow-dark), 0 20px 40px -12px var(--shadow-dark);
    }
    #flip-toggle:checked ~ .card-container .card {
      --flip: 180deg;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }
    .card-front, .card-back {
      position: absolute;
      inset: 0;
      background: var(--bg-secondary) var(--bg-texture);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px var(--shadow-light);
      backface-visibility: hidden;
      padding: 2.25rem 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-front::after, .card-back::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid var(--border-color);
      border-radius: 1px;
      opacity: 0.5;
      pointer-events: none;
    }
    .card-front {
      background-image: var(--bg-texture), var(--accent-gradient);
    }
    .card-back {
      transform: rotateY(180deg);
      align-items: flex-start;
      text-align: left;
      justify-content: flex-start;
      padding: 1.75rem;
      opacity: 0;
      animation: fadeInBack 0.8s ease forwards;
      animation-delay: 0.3s;
      overflow-y: auto;
    }
    @keyframes fadeInBack {
      to { opacity: 1; }
    }
    a {
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      position: relative;
    }
    a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }
    a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    a:hover {
      color: var(--accent);
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-weight: 500;
      font-size: clamp(0.72rem, 1vw, 0.78rem);
      letter-spacing: 0.03em;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
    }
    .top-row a {
      color: var(--text-primary);
    }
    .top-row > div:first-child {
      text-align: left;
    }
    .top-row > div:last-child {
      text-align: right;
    }
    .middle {
      margin: 1.75rem 0 1.5rem 0;
    }
    .bottom-row {
      font-size: clamp(0.7rem, 1vw, 0.76rem);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.03em;
      line-height: 1.7;
      text-align: center;
      color: var(--text-secondary);
    }
    .portfolio {
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .portfolio h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 0.75rem 0;
      flex-shrink: 0;
    }
    .portfolio ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      /* Custom scrollbar styling */
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) var(--bg-secondary);
    }
    
    /* Webkit scrollbar styling for Chrome/Safari */
    .portfolio ul::-webkit-scrollbar {
      width: 8px;
    }
    
    .portfolio ul::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 4px;
    }
    
    .portfolio ul::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
      transition: var(--transition-smooth);
    }
    
    .portfolio ul::-webkit-scrollbar-thumb:hover {
      background: var(--border-accent);
    }
    .portfolio li {
      font-size: 0.9rem;
      padding: 0;
      border-bottom: none;
      transition: var(--transition-smooth);
    }
    .portfolio li {
      animation: slideInStagger 0.6s ease-out both;
    }
    
    .portfolio li:nth-child(1) { animation-delay: 0.4s; }
    .portfolio li:nth-child(2) { animation-delay: 0.5s; }
    .portfolio li:nth-child(3) { animation-delay: 0.6s; }
    .portfolio li:nth-child(4) { animation-delay: 0.7s; }
    .portfolio li:nth-child(5) { animation-delay: 0.8s; }
    .portfolio li:nth-child(6) { animation-delay: 0.9s; }
    
    @keyframes slideInStagger {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    .portfolio li a {
      display: inline-block;
      width: 100%;
      padding: 2px;
      text-shadow: 1px 1px 1px var(--shadow-light);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), padding-left 0.3s ease, background 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .portfolio li a::before {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--shimmer-start), transparent);
      transition: left 0.6s ease;
    }
    
    .portfolio li a:hover {
      transform: translateX(8px) scale(1.02);
      padding-left: 8px;
      background: var(--hover-bg);
    }
    
    .portfolio li a:hover::before {
      left: 100%;
    }
    
    /* Dynamic Project Showcase */
    .project-item {
      background: transparent;
      border-radius: 3px;
      margin-bottom: 0.2rem;
      overflow: hidden;
      flex-shrink: 0;
      transition: var(--transition-smooth);
      border: 1px solid transparent;
    }

    .project-item:hover {
      border-color: var(--border-color);
      background: var(--hover-bg);
    }

    .project-item.expanded {
      border-color: var(--border-color);
      background: var(--hover-bg);
    }
    
    .project-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.5rem;
    }
    
    .project-main a {
      flex: 1;
      margin: 0;
      padding: 0;
    }
    
    .project-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: var(--transition-smooth);
      flex-shrink: 0;
      margin-left: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .project-toggle:hover {
      background: var(--hover-bg);
      transform: scale(1.1);
    }
    
    .project-details {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s ease;
    }

    .project-details > div {
      overflow: hidden;
      padding: 0 0.5rem;
    }

    .project-item.expanded .project-details {
      grid-template-rows: 1fr;
    }

    .project-item.expanded .project-details > div {
      padding: 0.4rem 0.5rem 0.6rem;
    }

    .project-item.expanded .project-toggle {
      transform: rotate(45deg);
    }

    .project-details p {
      margin: 0 0 0.5rem 0;
      font-size: 0.85rem;
      line-height: 1.45;
      color: var(--text-secondary);
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .tag {
      background: transparent;
      padding: 0.2rem 0.45rem;
      border-radius: 3px;
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.01em;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .tag:hover:not(.status-live):not(.status-progress):not(.status-source):not(.status-offline) {
      background: var(--accent);
      color: var(--bg-secondary);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .status-live {
      background: transparent;
      color: #4d7c5f;
      border-color: #4d7c5f;
    }
    [data-theme="dark"] .status-live {
      color: #7fb894;
      border-color: #7fb894;
    }

    .status-progress {
      background: transparent;
      color: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .status-source {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border-accent);
    }

    .status-offline {
      background: transparent;
      color: #a34a3f;
      border-color: #a34a3f;
    }
    
    /* Technology Filter */
    .tech-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    
    .filter-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-smooth);
      white-space: nowrap;
    }
    
    .filter-btn:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
      transform: translateY(-1px);
    }
    
    .filter-btn.active {
      background: var(--accent);
      color: var(--bg-secondary);
      border-color: var(--accent);
    }
    
    .project-item.hidden {
      display: none;
    }
    
    /* Accessibility: Reduce motion for users who prefer it */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      
      .card:hover {
        transform: none;
      }

      .logo-symbol:hover {
        transform: none;
      }
    }
    @media (max-width: 500px) {
      body {
        padding: 1.25rem 0.75rem;
      }
      .card {
        aspect-ratio: auto;
        height: min(78vh, 560px);
        height: min(78dvh, 560px);
      }
      .card-front, .card-back {
        padding: 1.75rem 1.5rem;
      }
      .top-row {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.4rem;
      }
      .top-row > div {
        width: 100%;
      }
      .middle {
        margin: 1.25rem 0;
      }
      .bottom-row {
        line-height: 1.6;
      }
    }
    
    /* Theme Toggle Button */
    .theme-toggle {
      position: fixed;
      top: 2rem;
      right: 2rem;
      width: 56px;
      height: 28px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: var(--transition-smooth);
      box-shadow: inset 0 1px 2px var(--shadow-dark), 0 2px 4px var(--shadow-dark);
      z-index: 1000;
      animation: slideInFromRight 0.8s ease-out 0.6s both;
    }
    
    @keyframes slideInFromRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: inset 0 1px 3px var(--shadow-dark), 0 4px 8px var(--shadow-dark);
    }
    
    .theme-toggle::before {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: var(--text-primary);
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: var(--transition-bounce);
      box-shadow: 0 2px 4px var(--shadow-dark);
    }
    
    [data-theme="dark"] .theme-toggle::before {
      transform: translateX(28px);
      background: var(--text-primary);
    }
    
    .theme-toggle::after {
      content: '☀️';
      position: absolute;
      left: 6px;
      font-size: 12px;
      opacity: 1;
      transition: var(--transition-smooth);

</head>

  <script>
    // Performance: Use passive listeners where appropriate
    const supportsPassive = (() => {
      let passive = false;
      try {
        const opts = Object.defineProperty({}, 'passive', {
          get: () => { passive = true; }
        });
        window.addEventListener('testPassive', null, opts);
        window.removeEventListener('testPassive', null, opts);
      } catch (e) {}
      return passive;
    })();
    
    // Render contact info at runtime (kept out of static HTML to deter scraper harvesting)
    document.addEventListener('DOMContentLoaded', function() {
      const emailUser = 'costasford';
      const emailHost = ['proton', 'me'].join('.');
      const email = emailUser + '@' + emailHost;
      const emailLink = document.getElementById('contact-email');
      if (emailLink) {
        emailLink.href = 'mailto:' + email;
        emailLink.textContent = email.toUpperCase();
        emailLink.removeAttribute('rel');
      }

      const phoneDigits = [6, 5, 0, 2, 5, 4, 6, 1, 3, 9].join('');
      const phoneDisplay = phoneDigits.slice(0, 3) + '.' + phoneDigits.slice(3, 6) + '.' + phoneDigits.slice(6);
      const phoneSpan = document.getElementById('contact-phone');
      if (phoneSpan) {
        phoneSpan.textContent = phoneDisplay;
      }
    });

    // Theme Toggle Functionality
    document.addEventListener('DOMContentLoaded', function() {
      const themeToggle = document.getElementById('theme-toggle');
      const flipToggle = document.getElementById('flip-toggle');
      const cardLabel = document.querySelector('label[for="flip-toggle"]');
      
      // Theme toggle handler
      themeToggle.addEventListener('click', function() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        // Update accessibility
        themeToggle.setAttribute('aria-label', 
          newTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        );
      });
      
      // Card flip accessibility
      flipToggle.addEventListener('change', function() {
        cardLabel.setAttribute('aria-pressed', this.checked);
      });
      
      // Keyboard accessibility for theme toggle
      themeToggle.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.click();
        }
      });
      
      // Initialize theme toggle accessibility
      const initialTheme = document.documentElement.getAttribute('data-theme');
      themeToggle.setAttribute('aria-label', 
        initialTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      );
      
      // Dynamic Project Showcase
      const projectToggles = document.querySelectorAll('.project-toggle');
      
      projectToggles.forEach(toggle => {
        toggle.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          
          const projectItem = this.closest('.project-item');
          const isExpanded = projectItem.classList.contains('expanded');
          
          // Close all other expanded items
          document.querySelectorAll('.project-item.expanded').forEach(item => {
            if (item !== projectItem) {
              item.classList.remove('expanded');
              item.querySelector('.project-toggle').setAttribute('aria-label', 'Show project details');
            }
          });
          
          // Toggle current item
          if (isExpanded) {
            projectItem.classList.remove('expanded');
            this.setAttribute('aria-label', 'Show project details');
          } else {
            projectItem.classList.add('expanded');
            this.setAttribute('aria-label', 'Hide project details');
          }
        });
        
        // Keyboard accessibility
        toggle.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });
      
      // Technology Filter System
      const filterButtons = document.querySelectorAll('.filter-btn');
      const projectItems = document.querySelectorAll('.project-item');
      const projectTags = document.querySelectorAll('.tag:not(.status-live):not(.status-progress):not(.status-source):not(.status-offline)');
      
      function filterProjects(filterValue) {
        projectItems.forEach(item => {
          const techData = item.getAttribute('data-tech');
          const techs = techData.split(',');
          
          if (filterValue === 'all' || techs.includes(filterValue)) {
            item.classList.remove('hidden');
            item.style.animation = 'slideInStagger 0.4s ease-out both';
          } else {
            item.classList.add('hidden');
          }
        });
        
        // Update active filter button
        filterButtons.forEach(btn => {
          btn.classList.remove('active');
          if (btn.getAttribute('data-filter') === filterValue) {
            btn.classList.add('active');
          }
        });
      }
      
      // Filter button click handlers
      filterButtons.forEach(button => {
        button.addEventListener('click', function() {
          const filterValue = this.getAttribute('data-filter');
          filterProjects(filterValue);
        });
        
        // Keyboard accessibility
        button.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });
      
      // Clickable project tags
      projectTags.forEach(tag => {
        tag.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const filterValue = this.textContent.trim();
          filterProjects(filterValue);
        });
        
        // Add tooltip-like effect
        tag.setAttribute('title', `Filter by ${tag.textContent.trim()}`);
      });
      
      // Enhanced Analytics (Optional - for future tracking)
      const projectLinks = document.querySelectorAll('a[target="_blank"]');
      projectLinks.forEach(link => {
        link.addEventListener('click', function() {
          // Future: Add analytics tracking here
          // gtag('event', 'project_click', { project_name: this.textContent });
        });
      });
      
      // Font Loading Optimization
      if ('fonts' in document) {
        document.fonts.ready.then(() => {
          document.body.classList.add('fonts-loaded');
        }).catch(() => {
          // Fallback: show content after 3 seconds regardless
          setTimeout(() => {
            document.body.classList.add('fonts-loaded');
          }, 3000);
        });
      } else {
        document.body.classList.add('fonts-loaded');
      }
    });

    // Mouse-tracking 3D tilt (mouse/trackpad only — skipped on touch and reduced-motion)
    document.addEventListener('DOMContentLoaded', function() {
      const cardContainer = document.querySelector('.card-container');
      const card = document.querySelector('.card');
      if (!cardContainer || !card) return;

      const canTilt = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!canTilt || reducedMotion) return;

      const MAX_TILT_DEG = 7;

      cardContainer.addEventListener('pointermove', function(e) {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const tiltY = (x - 0.5) * 2 * MAX_TILT_DEG;
        const tiltX = (0.5 - y) * 2 * MAX_TILT_DEG;

        card.style.transitionDuration = '0.1s, 0.5s';
        card.style.setProperty('--tilt-x', tiltX.toFixed(2) + 'deg');
        card.style.setProperty('--tilt-y', tiltY.toFixed(2) + 'deg');
      });

      cardContainer.addEventListener('pointerleave', function() {
        card.style.transitionDuration = '';
        card.style.setProperty('--tilt-x', '0deg');
        card.style.setProperty('--tilt-y', '0deg');
      });
    });
  </script>
